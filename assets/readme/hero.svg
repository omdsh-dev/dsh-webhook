<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">dsh-webhook — signed HTTP events become executed agent tasks with receipts</title>
  <desc id="desc">Project title with a verification seal as the mark beside the wordmark dsh-webhook, beside a four-step loop: a signed event arrives, is verified, is delivered as an agent task, and is answered with a delivery receipt.</desc>

  <rect width="1200" height="400" rx="26" fill="#0B0F14"/>

  <g id="title-block">
    <text x="72" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="20" letter-spacing="4" fill="#8494A3">DEEPSEEK HARNESS PLUGIN</text>

    <!-- title lockup: verification seal (ring + check) + wordmark -->
    <g transform="translate(72 0)">
      <g transform="translate(38 158)">
        <circle r="36" fill="#0B0F14" stroke="#F0B429" stroke-width="5"/>
        <path d="M-11 3 L-3 11 L13 -10" fill="none"
              stroke="#F0B429" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="96" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="72" font-weight="700" fill="#E6EDF3">dsh-webhook</text>
    </g>

    <text x="72" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="25" fill="#C4CFDA">Signed HTTP events become agent-session tasks —</text>
    <text x="72" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="25" fill="#C4CFDA">verified once, <tspan fill="#F0B429">answered with a receipt</tspan>.</text>

    <path d="M72 330 L600 330" stroke="#222C38" stroke-width="1.5"/>
    <text x="72" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#8494A3">MIT · zero runtime deps · omdsh-dev/dsh-webhook</text>
  </g>

  <g id="loop-proof">
    <rect x="672" y="56" width="456" height="288" rx="16" fill="#10161E" stroke="#222C38"/>

    <!-- spine -->
    <path d="M700 96 L700 264" stroke="#2A3644" stroke-width="3"/>

    <!-- step 1: event -->
    <g transform="translate(0 96)">
      <circle cx="700" cy="0" r="7" fill="#10161E" stroke="#F0B429" stroke-width="3"/>
      <text x="726" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="20" font-weight="600" fill="#E6EDF3">EVENT</text>
      <text x="726" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="17" fill="#8494A3">POST /hooks/github-ci</text>
    </g>

    <!-- step 2: verify -->
    <g transform="translate(0 152)">
      <circle cx="700" cy="0" r="7" fill="#F0B429"/>
      <text x="726" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="20" font-weight="600" fill="#E6EDF3">VERIFY</text>
      <text x="726" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="17" fill="#8494A3">401 / 403 / 404 / 413 / 429</text>
    </g>

    <!-- step 3: deliver -->
    <g transform="translate(0 208)">
      <circle cx="700" cy="0" r="7" fill="#5B9DFF"/>
      <text x="726" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="20" font-weight="600" fill="#E6EDF3">DELIVER</text>
      <text x="726" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="17" fill="#8494A3">follow-up turn · cold sessions wake</text>
    </g>

    <!-- step 4: receipt -->
    <g transform="translate(0 264)">
      <circle cx="700" cy="0" r="7" fill="#F0B429"/>
      <path d="M696.5 0 L699 2.6 L704 -3.4" stroke="#0B0F14" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="726" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="20" font-weight="600" fill="#E6EDF3">RECEIPT</text>
      <text x="726" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="17" fill="#8494A3">delivered · completed · LOOP-CLOSED</text>
    </g>
  </g>
</svg>